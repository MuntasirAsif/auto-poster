name: Publish due posts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build publish-due
        run: go build -o publish-due ./cmd/publish-due

      - name: Run publish-due
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOG_API_URL: ${{ secrets.BLOG_API_URL }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
        run: ./publish-due