name: Daily generate & publish

# Triggered once a day at 19:00 Asia/Dhaka (13:00 UTC) by the Supabase pg_cron
# job installed via scripts/setup_supabase_cron.sh. GitHub's own `schedule`
# cron is throttled on low-activity repos, so we deliberately do not rely on it
# here (and avoid double-runs).
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of posts to generate and publish"
        required: false
        default: "3"
      image:
        description: "Generate cover images (true/false)"
        required: false
        default: "true"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build daily
        run: go build -o daily ./cmd/daily

      - name: Generate and publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOG_API_URL: ${{ secrets.BLOG_API_URL }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
        run: |
          COUNT="${{ inputs.count }}"
          [ -z "$COUNT" ] && COUNT=3
          ARGS="-count $COUNT"
          if [ "${{ inputs.image }}" != "false" ]; then ARGS="$ARGS -image"; fi
          ./daily $ARGS
